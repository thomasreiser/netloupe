[workspace]
resolver = "2"
members = [".", "xtask"]

[package]
name = "netloupe"
version = "0.1.0"
edition = "2021"
description = "A terminal UI for inspecting hosts: DNS, mail security, ping/trace, TLS, HTTP, IP/ASN, hosting provider detection, geolocation, and reputation."
license = "Apache-2.0"
repository = "https://github.com/thomasreiser/netloupe"
default-run = "netloupe"

[lib]
name = "netloupe"
path = "src/lib.rs"

[[bin]]
name = "netloupe"
path = "src/main.rs"

[dependencies]
# TUI
ratatui = "0.30"
crossterm = "0.29"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "process", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

# DNS
hickory-resolver = { version = "0.26", features = ["tokio", "dnssec-ring"] }
hickory-proto = { version = "0.26", features = ["dnssec-ring"] }

# ICMP / ping
surge-ping = "0.9"
socket2 = "0.6"

# TLS. Pinned to the `ring` crypto backend (rather than the default
# aws-lc-rs) to avoid a cmake/NASM build dependency.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "1"
x509-parser = "0.18"
sha1 = "0.10"
sha2 = "0.10"

# HTTP. `http2` lets reqwest actually negotiate HTTP/2 via ALPN over TLS
# (without it, every response reports HTTP/1.1 regardless of what the
# server offers). `http3` (QUIC, via the pure-Rust quinn/h3 stack -- no
# OpenSSL) is still marked unstable upstream and needs the `reqwest_unstable`
# cfg flag to even compile; see `.cargo/config.toml`, which sets it project-
# wide. Both feed the HTTP pane's max-version check.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query", "http2", "http3"] }

# Range-list formats
csv = "1"

# IP prefixes / pattern matching
ipnet = { version = "2", features = ["serde"] }
ip_network = "0.4"
ip_network_table = "0.2"
globset = "0.4"
regex = "1"
idna = "1"

# GeoIP
maxminddb = "0.32"

# CLI / config
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
directories = "6"

# Errors / logging
thiserror = "2"
async-trait = "0.1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Misc
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
humantime = "2"
rand = "0.10"

[dev-dependencies]
tempfile = "3"
# `start_paused`/`tokio::time::pause` for deterministic timeout tests
# (checks::trace) that shouldn't depend on real network timing.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
